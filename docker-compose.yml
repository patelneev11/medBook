services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mednotebook-postgres
    environment:
      POSTGRES_USER: mednotebook_user
      POSTGRES_PASSWORD: mednotebook_pass
      POSTGRES_DB: mednotebook_dev
    ports:
      - "5433:5432"
    volumes:
      - mednotebook_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  mednotebook_pgdata:
